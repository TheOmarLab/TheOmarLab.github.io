name: "Omar Lab"
title: "Omar Lab | AI-Powered Computational Pathology Research"
description: "The Omar Lab at Cedars-Sinai develops AI-powered predictive and prognostic tools for cancer patients using tumor microenvironment analysis, digital pathology, and machine learning."

url: "https://www.omar-lab.com"

paginate: 5
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
paginate_path: "news/page:num"

permalink: pretty
markdown: kramdown
kramdown:
  parse_block_html: true

exclude:
        - .sass-cache/
        - .jekyll-cache/
        - gemfiles/
        - Gemfile
        - Gemfile.lock
        - node_modules/
        - vendor/bundle/
        - vendor/cache/
        - vendor/gems/
        - vendor/ruby/

collections:
        software:
                output: false
        affiliates:
                output: false
        members:
                output: true
        publications:
                output: false
        reviews:
                output: false
        alumni:
                output: true
        sep:
                output: false
        visitors:
                output: false
        undergrads:
                output: false
        tags:
                output: false
        funding:
                output: false

