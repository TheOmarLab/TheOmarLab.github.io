<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MEXWXLL7GV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MEXWXLL7GV');
    </script>
    <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} | {{ site.name }}{% endif %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="theme-color" content="#052049">
    <meta http-equiv="Permissions-Policy" content="interest-cohort=()"/>
    <meta name="author" content="Omar Lab, Cedars-Sinai Medical Center">
    <meta name="robots" content="index, follow">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link href="/static/css/syntax.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">

    <!-- RSS Feed -->
    <link rel="alternate" type="application/atom+xml" title="Omar Lab News Feed" href="{{ site.url }}/feed.xml">

    <!-- Open Graph Meta Tags (Facebook, LinkedIn) -->
    <meta property="og:title" content="{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} | {{ site.name }}{% endif %}">
    <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:site_name" content="{{ site.name }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:image" content="{{ site.url }}/static/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@MohamedOmarMD">
    <meta name="twitter:creator" content="@MohamedOmarMD">
    <meta name="twitter:title" content="{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} | {{ site.name }}{% endif %}">
    <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="twitter:image" content="{{ site.url }}/static/img/og-image.png">

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ResearchOrganization",
          "@id": "{{ site.url }}/#organization",
          "name": "Omar Lab",
          "alternateName": "The Omar Lab at Cedars-Sinai",
          "url": "{{ site.url }}",
          "logo": {
            "@type": "ImageObject",
            "url": "{{ site.url }}/static/img/logo/ol_logo.png"
          },
          "image": "{{ site.url }}/static/img/logo/ol_logo.png",
          "description": "{{ site.description }}",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "700 N. San Vicente Blvd, G-540",
            "addressLocality": "West Hollywood",
            "addressRegion": "CA",
            "postalCode": "90069",
            "addressCountry": "US"
          },
          "parentOrganization": {
            "@type": "MedicalOrganization",
            "name": "Cedars-Sinai Medical Center",
            "url": "https://www.cedars-sinai.org"
          },
          "department": [
            {
              "@type": "Organization",
              "name": "Department of Computational Biomedicine",
              "url": "https://www.cedars-sinai.edu/health-sciences-university/research/departments-institutes/computational-biomedicine.html"
            },
            {
              "@type": "Organization",
              "name": "Department of Urology",
              "url": "https://www.cedars-sinai.edu/health-sciences-university/research/departments-institutes/urology.html"
            }
          ],
          "sameAs": [
            "https://github.com/TheOmarLab",
            "https://twitter.com/MohamedOmarMD"
          ],
          "knowsAbout": [
            "Computational Pathology",
            "Artificial Intelligence in Medicine",
            "Tumor Microenvironment",
            "Digital Pathology",
            "Cancer Research",
            "Machine Learning"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "{{ site.url }}/#website",
          "url": "{{ site.url }}",
          "name": "{{ site.name }}",
          "description": "{{ site.description }}",
          "publisher": {
            "@id": "{{ site.url }}/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.google.com/search?q=site:omar-lab.com+{search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Person",
          "@id": "{{ site.url }}/#person",
          "name": "Mohamed Omar",
          "givenName": "Mohamed",
          "familyName": "Omar",
          "honorificPrefix": "Dr.",
          "honorificSuffix": "M.D.",
          "url": "{{ site.url }}",
          "image": {
            "@type": "ImageObject",
            "url": "{{ site.url }}/static/img/members/omar.jpg",
            "width": 800,
            "height": 800
          },
          "jobTitle": "Assistant Professor of Computational Biomedicine and Urology",
          "description": "Mohamed Omar, M.D. is an Assistant Professor and Principal Investigator at Cedars-Sinai Medical Center, leading the Omar Lab focused on AI-powered computational pathology and cancer research.",
          "worksFor": {
            "@type": "MedicalOrganization",
            "name": "Cedars-Sinai Medical Center",
            "url": "https://www.cedars-sinai.org",
            "department": [
              {"@type": "Organization", "name": "Department of Computational Biomedicine"},
              {"@type": "Organization", "name": "Department of Urology"}
            ]
          },
          "affiliation": [
            {
              "@type": "MedicalOrganization",
              "name": "Samuel Oschin Comprehensive Cancer Institute",
              "url": "https://www.cedars-sinai.edu/health-sciences-university/research/departments-institutes/cancer.html"
            }
          ],
          "knowsAbout": [
            "Computational Pathology",
            "Artificial Intelligence",
            "Cancer Research",
            "Tumor Microenvironment",
            "Digital Pathology",
            "Machine Learning",
            "Prostate Cancer",
            "Bladder Cancer"
          ],
          "sameAs": [
            "https://www.wikidata.org/wiki/Q96824055",
            "https://www.linkedin.com/in/mohamed-omar-md/",
            "https://scholar.google.com/citations?user=iHJ6TzcAAAAJ",
            "https://twitter.com/MohamedOmarMD",
            "https://orcid.org/0000-0002-8068-1920",
            "https://www.scopus.com/authid/detail.uri?authorId=57221512716",
            "https://researchers.cedars-sinai.edu/Mohamed.Omar",
            "https://github.com/MohamedOmar2020",
            "https://github.com/TheOmarLab"
          ],
          "alumniOf": [
            {
              "@type": "CollegeOrUniversity",
              "name": "Johns Hopkins University",
              "url": "https://www.jhu.edu"
            },
            {
              "@type": "CollegeOrUniversity",
              "name": "Weill Cornell Medicine",
              "url": "https://weill.cornell.edu"
            }
          ],
          "award": "DoD Award HT9425-24-1-0381",
          "nationality": "American"
        }
      ]
    }
    </script>
  </head>

  <body>

    <!-- Static navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #052049">
        <a class="navbar-brand" href="/">{{site.name}}</a>
        <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="navbar-collapse collapse" id="navbarContent">
          <ul class="navbar-nav ml-auto">
            {% for link in site.data.navigation %}
              {% if page.group == link.group %}
                <li class = "nav-item active"><a class="nav-link" href="{{link.link}}"> {{link.name}}<span class="sr-only">(current)</span></a></li>
              {% else %}
                <li class="nav-item"><a class="nav-link" href="{{link.link}}"> {{link.name}}</a></li>
              {% endif %}
            {% endfor %}
          </ul>
        </div>
      </nav>

    <div class="container">
