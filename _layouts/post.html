{% include header.html %}
<main id="main-content">
<div class="container px-0" style="max-width: 100%">
    <div class="row">
        <div class="col-12">
            <h1 style="font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem;">{{ page.title }}</h1>
            {% if page.date %}
            <p style="color: #6c757d; margin-bottom: 1.5rem;">
              <em>{{ page.date | date: "%B %-d, %Y" }}</em>
            </p>
            {% endif %}
            {{ content }}
        </div>
    </div>
</div>
</main>
{% include footer.html %}
